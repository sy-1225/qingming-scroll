<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>清明上河图 · 画卷漫游</title><link rel="stylesheet" href="style.css"><body>
<main><div id="view" tabindex="0" aria-label="左右拖动画卷，滚轮缩放"><div id="world"><img id="painting" src="scroll.jpg" draggable="false" alt="清明上河图设色重绘长卷"></div></div>
<header><div class="brand"><h1>清明上河图<span>宋韵</span></h1><p>走进北宋 · 汴京的城市生活</p></div><nav id="filters"></nav><div class="tools"><button id="ambience" aria-label="开启市集环境声" aria-pressed="false"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h4l5-4v14l-5-4H3z"/><path class="waves" d="M15 8q4 4 0 8m3-11q7 7 0 14"/><path class="silence" d="m16 10 5 5m0-5-5 5"/></svg></button><button id="search" aria-label="搜索画中风物">⚲</button><button id="full" aria-label="全屏">⛶</button><button id="about" aria-label="画卷菜单">☰</button></div></header>
<div id="card" hidden><button class="close" aria-label="关闭介绍">×</button><div id="detail"></div><div><small id="kind"></small><h2 id="name"></h2><p id="desc"></p><button id="more">了解更多 ›</button></div></div>
<div class="locator"><button id="prev" aria-label="向左展卷">‹</button><div class="map" id="map" tabindex="0" role="slider" aria-label="长卷位置" aria-valuemin="0" aria-valuemax="100"><span id="frame"></span></div><button id="next" aria-label="向右展卷">›</button></div></main>
<dialog id="notes"><button class="close" aria-label="关闭">×</button><h2>画卷导览</h2><p>此卷依《清明上河图》的城郭、虹桥与郊野重新设色绘制。左右拖动游览，点击竖牌或画中活动人物赏读细节。</p><div class="chapters"><button data-pos=".16">城中百业</button><button data-pos=".50">虹桥市集</button><button data-pos=".84">汴郊春行</button></div><p>画面缩放　<button id="minus">−</button> <output id="ratio">1×</output> <button id="plus">＋</button></p></dialog>
<dialog id="finder"><button class="close" aria-label="关闭">×</button><h2>寻访画中事</h2><input id="query" aria-label="搜索" placeholder="搜索茶楼、虹桥、船工…"><div id="results"></div></dialog>
<dialog id="reading"><button class="close" aria-label="关闭">×</button><small id="readingKind"></small><h2 id="readingTitle"></h2><p id="readingText"></p></dialog><script src="motion.js"></script><script src="app.js"></script><audio id="market-sound" src="market.wav" preload="auto" loop></audio><script src="ambience.js"></script></body></html>
